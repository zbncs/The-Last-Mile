  <rect width="1600" height="900" fill="#151b1e"/>
  <text x="70" y="62" fill="#f0eee8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="32" font-weight="700">《最后一公里》画风方向参考板</text>
  <text x="70" y="100" fill="#aab3b1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">同一场景：救援车在建筑外建立接近点，玩家下车进入受损转运站</text>

