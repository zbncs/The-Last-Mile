  <text x="150" y="777" fill="#f2e4ae" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">推荐：半写实环境 ＋ 风格化可读性 ＋ 外星能量高亮</text>
  <text x="150" y="810" fill="#c0cbc7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17">让车辆和伤害有重量，让敌人、入口、伤员和共生能力在斜俯视战斗中清楚可见。</text>
