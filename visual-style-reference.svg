    </linearGradient>
    <linearGradient id="rightSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#284554"/><stop offset="1" stop-color="#112b39"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
